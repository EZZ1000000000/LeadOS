# LeadOS — نشر تلقائي على Vercel عبر GitHub Actions
# (بديل موثوق للنشر المحلي — يشتغل من بنية GitHub النظيفة)
name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # زر تشغيل يدوي

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}","projectName":"leados-v2"}' > .vercel/project.json

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59 deploy --prod --yes --force \
            --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="${{ github.sha }}" \
            --meta githubCommitMessage="$(git log -1 --pretty=%s | head -c 200)" 2>&1 | tee deploy.log
          grep -qE "Production|https://" deploy.log
